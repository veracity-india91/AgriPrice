<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgriPrice - Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-box {
            width: 380px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #166534;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            height: 43px;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        button {
            width: 100%;
            height: 43px;
            border: none;
            border-radius: 7px;
            background: #16a34a;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .login-link a {
            color: #166534;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1>🌾 AgriPrice</h1>

        <form onsubmit="registerUser(event)">

            <label>Full Name</label>
            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p id="message"></p>

        <div class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </div>

    </div>


    <script>

        async function registerUser(event) {

            event.preventDefault();

            const fullName =
                document.getElementById("fullName").value;

            const email =
                document.getElementById("email").value;

            const phone =
                document.getElementById("phone").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");


            try {

                const response = await fetch("/api/users/register", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        fullName: fullName,
                        email: email,
                        phone: phone,
                        password: password
                    })

                });


                const data = await response.json();


                if (response.ok) {

                    message.style.color = "green";

                    message.innerText =
                        "Registration successful!";

                    setTimeout(() => {
                        window.location.href = "/login";
                    }, 1000);

                } else {

                    message.style.color = "red";

                    message.innerText =
                        data;

                }

            } catch (error) {

                console.error(error);

                message.style.color = "red";

                message.innerText =
                    "Unable to connect to backend.";

            }

        }

    </script>

</body>
</html>
